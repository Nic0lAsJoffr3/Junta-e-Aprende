  <script src="js/supabase.js"></script>
  <script src="js/config.js" defer></script>

  <style>
    .color-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(58px, 1fr));
      gap: 12px;
      margin-top: 10px;
    }

    .color-button {
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      min-height: 58px;
      padding: 0;
      border-radius: 16px;
      border: 3px solid var(--line);
      box-shadow: 0 5px 0 var(--line);
      background: var(--swatch);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .color-button:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 0 var(--line);
    }

    .color-button[aria-pressed="true"] {
      border-color: var(--text);
      box-shadow: 0 5px 0 var(--text);
    }

    .color-button[aria-pressed="true"]::after {
      content: "✓";
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: #ffffff;
      font-size: 1.6rem;
      font-weight: 900;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.45);
    }

    .color-button:focus-visible {
      outline: 3px solid var(--text);
      outline-offset: 3px;
    }

    .theme-buttons {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 10px;
    }

    .theme-button {
      justify-content: center;
      min-height: 64px;
    }

    .theme-button[aria-pressed="true"] {
      background: var(--theme-accent);
      border-color: var(--theme-accent-dark);
      color: #ffffff;
      box-shadow: 0 4px 0 var(--theme-accent-dark);
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main-content">
    Pular para o conteúdo principal
  </a>

  <div class="container">
    <header>
      <h1>Junta&amp;Aprende</h1>

      <div class="top-actions">
        <nav class="nav-links" aria-label="Navegação principal">
          <a href="adm.html">Administrador</a>

          <a
            href="index.html"
            class="play-link"
            aria-label="Ir para a área dos jogadores"
          >
            Jogar
          </a>
        </nav>
      </div>
    </header>

    <main id="main-content">
      <section class="card" aria-labelledby="preferences-title">
        <h2 id="preferences-title">Configurações de aparência</h2>

        <div class="field">
          <label id="theme-label">Tema</label>

          <div
            class="theme-buttons"
            role="group"
            aria-labelledby="theme-label"
          >
            <button
              type="button"
              class="theme-button"
              data-theme-choice="light"
              aria-pressed="false"
            >
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="4"/>
                <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
              </svg>
              Claro
            </button>

            <button
              type="button"
              class="theme-button"
              data-theme-choice="dark"
              aria-pressed="false"
            >
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/>
              </svg>
              Escuro
            </button>
          </div>
        </div>

        <div class="field">
          <label id="color-label">Cor de destaque</label>

          <div
            id="color-grid"
            class="color-grid"
            role="group"
            aria-labelledby="color-label"
          ></div>

          <p class="hint">
            Toque em uma cor para aplicá-la em todo o site.
          </p>
        </div>

        <p class="hint">
          As preferências ficam salvas neste navegador por um ano.
        </p>
      </section>
    </main>

    <footer class="site-footer">
      <a
        class="footer-brand"
        href="https://junta.e.aprende.nicolasjoffre.com.br/"
        target="_blank"
        rel="noopener"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3z"/>
          <path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/>
        </svg>
        Junta&amp;Aprende
      </a>

      <span class="footer-credits">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3z"/>
          <path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/>
        </svg>
        Créditos:
        <a
          href="https://junta.e.aprende.nicolasjoffre.com.br/"
          target="_blank"
          rel="noopener"
        >
          NicolasJoffre
        </a>
      </span>
    </footer>
  </div>
</body>
</html>
