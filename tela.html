<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Junta&amp;Aprende — Tela de apresentação</title>

  <meta
    name="description"
    content="Tela de apresentação do Junta&Aprende com QR Code, código da partida e ranking dos dez líderes."
  >
  <meta name="author" content="Nícolas Joffre De Souza">
  <meta name="theme-color" content="#2563eb">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Junta&amp;Aprende">
  <meta property="og:title" content="Junta&amp;Aprende — Tela de apresentação">
  <meta
    property="og:description"
    content="Exiba o QR Code, o código da partida e o ranking dos dez líderes."
  >
  <meta
    property="og:url"
    content="https://junta.e.aprende.nicolasjoffre.com.br/tela.html"
  >
  <meta
    property="og:image"
    content="https://junta.e.aprende.nicolasjoffre.com.br/assets/logo.png"
  >

  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Junta&amp;Aprende — Tela de apresentação">
  <meta
    name="twitter:description"
    content="Exiba o QR Code, o código da partida e o ranking dos dez líderes."
  >
  <meta
    name="twitter:image"
    content="https://junta.e.aprende.nicolasjoffre.com.br/assets/logo.png"
  >

  <link rel="icon" href="assets/icon.ico" type="image/x-icon">
  <link rel="shortcut icon" href="assets/icon.ico" type="image/x-icon">

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/tela.css">

  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/tela.js" defer></script>
</head>
<body>
  <div
    class="theme-background"
    id="theme-background"
    aria-hidden="true"
    hidden
  ></div>

  <div class="screen">
    <header class="site-header">
      <a
        class="site-brand"
        href="https://junta.e.aprende.nicolasjoffre.com.br/"
        target="_blank"
        rel="noopener"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3z"/>
          <path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/>
        </svg>
        Junta&amp;Aprende
      </a>

      <a
        class="site-link"
        href="https://junta.e.aprende.nicolasjoffre.com.br/"
        target="_blank"
        rel="noopener"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M10 13a5 5 0 007.5.5l3-3a5 5 0 00-7-7l-1.8 1.8"/>
          <path d="M14 11a5 5 0 00-7.5-.5l-3 3a5 5 0 007 7l1.8-1.8"/>
        </svg>
        junta.e.aprende.nicolasjoffre.com.br
      </a>
    </header>

    <main class="screen-grid">
      <section class="panel left-panel" aria-labelledby="game-title">
        <h1 id="game-title" class="game-title">
          Carregando partida...
        </h1>

        <div id="room-code" class="room-code" aria-live="polite">
          ------
        </div>

        <div class="qr-row">
          <div class="qr-box">
            <div
              id="qrcode"
              aria-label="QR Code para entrar na partida"
            ></div>

            <p class="qr-label">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M3 8V5a2 2 0 012-2h3M16 3h3a2 2 0 012 2v3M21 16v3a2 2 0 01-2 2h-3M8 21H5a2 2 0 01-2-2v-3"/>
                <path d="M7 12h10"/>
              </svg>
              Escaneie para entrar e informar seu nome
            </p>

            <p
              id="screen-status"
              class="screen-status"
              role="status"
              aria-live="polite"
            ></p>
          </div>

          <div
            class="theme-art"
            id="theme-art"
            aria-hidden="true"
          ></div>
        </div>
      </section>

      <section class="panel right-panel" aria-labelledby="leaders-title">
        <h2 id="leaders-title" class="panel-heading">
          <span class="heading-icon">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M8 21h8M12 17v4"/>
              <path d="M7 4h10v5a5 5 0 01-10 0V4z"/>
              <path d="M17 5h3a2 2 0 01-2 4h-1M7 5H4a2 2 0 002 4h1"/>
            </svg>
          </span>
          Top 10 líderes
        </h2>

        <div
          id="leaders"
          class="leaders"
          aria-live="polite"
          aria-label="Ranking dos dez líderes"
        ></div>
      </section>
    </main>

    <footer class="site-footer">
      <span>Junta&amp;Aprende — aprenda jogando</span>

      <span class="footer-credits">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3z"/>
          <path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/>
        </svg>
        Créditos:
        <a
          href="https://junta.e.aprende.nicolasjoffre.com.br/"
          target="_blank"
          rel="noopener"
        >
          Nícolas Joffre De Souza
        </a>
      </span>
    </footer>
  </div>
</body>
</html>
